<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        width: 260px;
        padding: 14px;
      }

      h3 {
        margin-top: 0;
      }

      button {
        width: 100%;
        border: 0;
        background: #0f8f9f;
        color: white;
        font-weight: 800;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .small {
        color: #52616f;
        font-size: 12px;
        line-height: 1.4;
      }

      #status {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h3>Ocean FB Poster</h3>

    <p class="small">
      Use Prepare Facebook Posts from Ocean Specials. One group opens at a time. Review the prepared post and click Facebook's Post button. The next group opens automatically.
    </p>

    <button id="closeWindows">Close All Posting Windows</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
